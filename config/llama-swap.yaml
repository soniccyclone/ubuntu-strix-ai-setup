# The serving contract. One port, both API shapes, models addressed by ROLE.
#
# This file is the only place a model choice lives. Frontends name a role;
# what serves it is decided here. Every number in the comments was measured on
# this machine — see .necklace/2026-08-19-local-claude-suite/repl/results.md.
#
# Binds 0.0.0.0 because rootless podman containers cannot reach a
# loopback-bound host service (measured: 127.0.0.1 -> 000, 0.0.0.0 -> 200).
# The LAN is closed with a firewall rule instead; see docs/privileged-steps.md.

macros:
  server: /home/nathan/.local/opt/llama.cpp-vulkan/llama-b10502/llama-server
  m: /home/nathan/models
  # -ngl 999 because partial offload is a proportional loss on this part:
  # the CPU reaches ~80 GB/s of a ~256 GB/s bus (repl/membw.c).
  common: "--host 127.0.0.1 --port ${PORT} -ngl 999 -fa on --no-warmup"
  # Full native context on every role. This is nearly free on these models
  # because three quarters of their blocks are Gated DeltaNet, whose state is
  # constant rather than growing with the window. Measured on the 122B:
  #     32k   76.0 GiB      128k  78.5 GiB      262k  81.9 GiB
  # Eight times the context for 5.9 GiB. A standard transformer would have
  # needed roughly eight times the KV cache for the same window.
  # (context is set per role below, not via a macro, so each role's window is
  # visible where its weights are named)

models:
  # 20.74 GiB | 811 pp512 | 59.6 tg128 | vision via mmproj | 262k native ctx
  # bartowski PLAIN quant, deliberately not unsloth's UD build: identical size,
  # 2.24x slower, because its IQ tensors land on the Gated DeltaNet path.
  fast:
    cmd: >
      ${server} ${common}
      -m ${m}/qwen3.6-bartowski/Qwen_Qwen3.6-35B-A3B-Q4_K_M.gguf
      --mmproj ${m}/qwen3.6-35b-a3b/mmproj-F16.gguf
      -c 262144
    ttl: 900
    aliases: ["vision", "gpt-4o-mini", "claude-3-5-haiku-latest"]
    env:
      - "LD_LIBRARY_PATH=/home/nathan/.local/opt/llama.cpp-vulkan/llama-b10502"

  # Same weights, no projector. Exists so a text-only role can refuse an image
  # rather than answer confidently about one it cannot see (CUJ-05).
  fast-text:
    cmd: >
      ${server} ${common}
      -m ${m}/qwen3.6-bartowski/Qwen_Qwen3.6-35B-A3B-Q4_K_M.gguf
      -c 262144
    ttl: 600
    env:
      - "LD_LIBRARY_PATH=/home/nathan/.local/opt/llama.cpp-vulkan/llama-b10502"

  # 69.10 GiB | 215 pp512 | 26.4 tg128 | vision | 262k native ctx
  # Could not be loaded at all before GTT went 61.41 -> 110 GiB.
  deep:
    cmd: >
      ${server} ${common}
      -m ${m}/qwen3.5-122b/Qwen3.5-122B-A10B-Q4_K_M-00001-of-00002.gguf
      --mmproj ${m}/qwen3.5-122b/mmproj-BF16.gguf
      -c 262144
    ttl: 600
    aliases: ["claude-sonnet-4-5", "gpt-4o"]
    env:
      - "LD_LIBRARY_PATH=/home/nathan/.local/opt/llama.cpp-vulkan/llama-b10502"

# fast (20.7) + deep (69.1) = 89.8 GiB against 108.3 free, so both can be
# resident. Anything larger must swap, which is what the ttls are for.
groups:
  resident:
    swap: false
    exclusive: false
    members: ["fast", "fast-text"]
